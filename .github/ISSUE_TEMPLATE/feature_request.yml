name: Feature Request
description: Suggest a new tool or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: I need to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the tool or change you'd like
      placeholder: |
        Tool name: `do_something`
        Catalog API endpoint: `GET /v1/images/{name}/...`
        Parameters: ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?

  - type: dropdown
    id: scope
    attributes:
      label: Tool Category
      description: Which area does this feature belong to?
      options:
        - Images
        - Tags
        - Vulnerabilities
        - Releases / History
        - Security / Config
        - New Category
    validations:
      required: true

  - type: dropdown
    id: catalog_api
    attributes:
      label: Catalog API Reference
      description: Does this correspond to an existing catalog API endpoint?
      options:
        - "Yes - documented in the catalog OpenAPI spec"
        - "No - new behavior / aggregation"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information, API docs links, or examples
